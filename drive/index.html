<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX | Ultimate Drive Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #030712; color: #e2e8f0; scroll-behavior: smooth; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(55, 65, 81, 0.5); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; }
        .glass-panel:hover { border-color: rgba(59, 130, 246, 0.5); transform: translateY(-2px); }
        .btn-glow { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: all 0.3s; }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); transform: scale(1.02); }
        input { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; font-size: 0.8rem !important; }
        
        /* Menu Dropdown */
        .dropdown:hover .dropdown-menu { display: block; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/80 p-6 rounded-[2rem] border border-slate-800 sticky top-4 z-50 backdrop-blur-md">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fab fa-google-drive text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">TECHZONEX</h1>
                    <div class="flex items-center gap-2">
                        <div id="status-dot" class="w-2 h-2 bg-red-500 rounded-full"></div>
                        <span id="status-text" class="text-xs font-medium text-slate-400 uppercase tracking-widest">Offline</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <div class="relative dropdown">
                    <button class="px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-bold text-sm transition flex items-center gap-2">
                        <i class="fas fa-bars"></i> Quick Menu
                    </button>
                    <div class="dropdown-menu hidden absolute right-0 top-full mt-2 w-56 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl overflow-hidden">
                        <a href="#card-copy" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"><i class="fas fa-copy w-6 text-blue-500"></i> Clone</a>
                        <a href="#card-rename" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"><i class="fas fa-i-cursor w-6 text-purple-500"></i> Rename</a>
                        <a href="#card-trim" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"><i class="fas fa-scissors w-6 text-red-500"></i> Trim</a>
                        <a href="#card-watermark" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"><i class="fas fa-stamp w-6 text-cyan-500"></i> Watermark</a>
                        <a href="#card-merge" class="block px-4 py-3 text-sm text-slate-300 hover:bg-slate-800 hover:text-white"><i class="fas fa-object-group w-6 text-indigo-500"></i> Merge</a>
                    </div>
                </div>

                <div id="auth-container">
                    <button onclick="login()" class="px-8 py-3 btn-glow text-white rounded-xl font-bold text-sm">Initialize</button>
                </div>
            </div>
        </header>

        <div id="monitor-panel" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fas fa-microchip text-blue-500 animate-spin-slow"></i>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Active Processes</h2>
                </div>
                <button onclick="clearAllReports()" class="text-[10px] text-slate-500 hover:text-white underline">Clear All Reports</button>
            </div>
            <div id="task-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div id="card-copy" class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-blue-500/10 rounded-xl"><i class="fas fa-copy text-blue-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-01</span>
                </div>
                <h3 class="text-lg font-bold text-white">Recursive Clone</h3>
                <input type="text" id="cp-src" placeholder="Source Folder ID/URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <input type="text" id="cp-dst" placeholder="Destination (Empty for Root)" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('copy', {src:'cp-src', dst:'cp-dst'})" class="w-full py-3 btn-glow rounded-xl font-bold text-sm text-white">Start Cloning</button>
            </div>

            <div id="card-rename" class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-purple-500/10 rounded-xl"><i class="fas fa-i-cursor text-purple-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-02</span>
                </div>
                <h3 class="text-lg font-bold text-white">Bulk Renamer</h3>
                <input type="text" id="rn-url" placeholder="Folder URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="rn-s" placeholder="Find" class="p-3 rounded-xl text-sm input-dark">
                    <input type="text" id="rn-r" placeholder="Replace" class="p-3 rounded-xl text-sm input-dark">
                </div>
                <button onclick="run('rename', {url:'rn-url', search:'rn-s', replace:'rn-r'})" class="w-full py-3 bg-purple-600 hover:bg-purple-700 transition rounded-xl font-bold text-sm text-white">Execute Rename</button>
            </div>

            <div id="card-info" class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-pink-500/10 rounded-xl"><i class="fas fa-chart-pie text-pink-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-03</span>
                </div>
                <h3 class="text-lg font-bold text-white">Quick Diagnostics</h3>
                <input type="text" id="qa-url" placeholder="File or Folder URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="run('count', {url:'qa-url'})" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-xs uppercase transition text-slate-300">Count Files</button>
                    <button onclick="run('info', {url:'qa-url'})" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-xs uppercase transition text-slate-300">Get Metadata</button>
                </div>
            </div>

            <div id="card-trim" class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-red-500/10 rounded-xl"><i class="fas fa-scissors text-red-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-08</span>
                </div>
                <h3 class="text-lg font-bold text-white">Video Trimmer</h3>
                <input type="text" id="tr-url" placeholder="Video Link/ID" class="w-full p-3 rounded-xl text-sm input-dark" onblur="fetchDuration(this.value)">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="tr-start" placeholder="Start (00:00:00)" class="p-3 rounded-xl text-sm input-dark">
                    <input type="text" id="tr-end" placeholder="End (00:00:00)" class="p-3 rounded-xl text-sm input-dark">
                </div>
                <button onclick="run('trim', {url:'tr-url', start:'tr-start', end:'tr-end'})" class="w-full py-3 bg-red-600 hover:bg-red-700 transition rounded-xl font-bold text-sm text-white">Trim & Upload</button>
            </div>

            <div id="card-merge" class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-indigo-500/10 rounded-xl"><i class="fas fa-object-group text-indigo-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-09</span>
                </div>
                <h3 class="text-lg font-bold text-white">Video Merger</h3>
                <input type="text" id="vm-1" placeholder="First Video Link/ID" class="w-full p-3 rounded-xl text-sm input-dark">
                <input type="text" id="vm-2" placeholder="Second Video Link/ID" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('merge', {src1:'vm-1', src2:'vm-2'})" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 transition rounded-xl font-bold text-sm text-white">Merge & Upload</button>
            </div>

            <div id="card-watermark" class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-cyan-500/10 rounded-xl"><i class="fas fa-stamp text-cyan-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-10</span>
                </div>
                <h3 class="text-lg font-bold text-white">Video Watermark</h3>
                <input type="text" id="wm-url" placeholder="Video Link/ID" class="w-full p-3 rounded-xl text-sm input-dark">
                <select id="wm-type" class="w-full p-3 rounded-xl text-sm bg-slate-900 text-white border border-slate-700 mb-2">
                    <option value="text">Scrolling Text</option>
                    <option value="image">Logo Overlay (Bottom Right)</option>
                </select>
                <input type="text" id="wm-text" placeholder="Text (Use | for multiple lines)" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('watermark', {url:'wm-url', type:'wm-type', text:'wm-text'})" class="w-full py-3 bg-cyan-600 hover:bg-cyan-700 transition rounded-xl font-bold text-sm text-white">Apply Watermark</button>
            </div>

        </div>
    </div>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";
        const tasks = JSON.parse(localStorage.getItem('active_tasks') || '[]');

        function login() { window.location.href = API + "/auth/login"; }

        async function checkServer() {
            try {
                const r = await fetch(API + "/");
                if(r.ok) {
                    document.getElementById('status-dot').className = "w-2 h-2 bg-green-500 rounded-full animate-pulse";
                    document.getElementById('status-text').innerText = "System Online";
                }
            } catch(e) {
                document.getElementById('status-dot').className = "w-2 h-2 bg-red-600 rounded-full";
                document.getElementById('status-text').innerText = "OFFLINE";
            }
        }

        function initAuth() {
            checkServer();
            const h = window.location.hash;
            if (h.includes('auth_data=')) {
                localStorage.setItem('drive_creds', decodeURIComponent(h.split('auth_data=')[1]));
                window.history.replaceState(null, null, window.location.pathname);
            }
            if (localStorage.getItem('drive_creds')) {
                document.getElementById('auth-container').innerHTML = `
                    <div class="flex items-center gap-3 bg-slate-900 border border-slate-700 px-5 py-2.5 rounded-xl">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-widest">Authorized</span>
                        <button onclick="localStorage.removeItem('drive_creds'); location.reload()" class="ml-2 text-slate-500 hover:text-white transition"><i class="fas fa-sign-out-alt"></i></button>
                    </div>`;
            }
            tasks.forEach(id => track(id));
        }

        // Fetch duration logic (same as before)
        async function fetchDuration(url) {
            if(!url) return;
            const creds = localStorage.getItem('drive_creds');
            if (!creds) return;
            document.getElementById('tr-start').value = "Loading...";
            try {
                const res = await fetch(API + '/api/get_duration', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url, creds})
                });
                const data = await res.json();
                if(data.duration) {
                    document.getElementById('tr-start').value = "00:00:00";
                    document.getElementById('tr-end').value = data.duration;
                }
            } catch(e) { console.error(e); }
        }

        async function run(action, fields) {
            const creds = localStorage.getItem('drive_creds');
            if (!creds) return alert("Please connect your account first.");
            const body = { action, creds };
            for(let k in fields) body[k] = document.getElementById(fields[k]).value;

            try {
                const res = await fetch(API + '/api/run', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                const data = await res.json();
                tasks.push(data.task_id);
                localStorage.setItem('active_tasks', JSON.stringify(tasks));
                track(data.task_id);
            } catch(e) { alert("Error connecting to cloud engine."); }
        }

        function cancelTask(id) { fetch(`${API}/api/cancel/${id}`, {method:'POST'}); }

        function dismissTask(id) {
            const card = document.getElementById(`card-${id}`);
            if(card) card.remove();
            const idx = tasks.indexOf(id);
            if(idx > -1) {
                tasks.splice(idx, 1);
                localStorage.setItem('active_tasks', JSON.stringify(tasks));
            }
            if(tasks.length === 0) document.getElementById('monitor-panel').classList.add('hidden');
            fetch(`${API}/api/dismiss/${id}`, {method:'POST'});
        }

        function clearAllReports() {
            document.querySelectorAll('button[onclick^="dismissTask"]').forEach(btn => btn.click());
            if(tasks.length > 0) {
                 tasks.forEach(id => fetch(`${API}/api/dismiss/${id}`, {method:'POST'}));
                 localStorage.setItem('active_tasks', '[]');
                 document.getElementById('task-list').innerHTML = "";
                 document.getElementById('monitor-panel').classList.add('hidden');
            }
        }

        function track(id) {
            document.getElementById('monitor-panel').classList.remove('hidden');
            if(document.getElementById(`card-${id}`)) return;
            const grid = document.getElementById('task-list');
            const card = document.createElement('div');
            card.id = `card-${id}`;
            card.className = "bg-slate-900/50 border border-blue-500/20 p-5 rounded-2xl relative overflow-hidden transition-all duration-500";
            grid.appendChild(card);

            const timer = setInterval(async () => {
                try {
                    const r = await fetch(`${API}/api/status/${id}`);
                    const s = await r.json();

                    // Generate detailed stats HTML if available
                    let detailedStats = "";
                    if(s.categories && Object.keys(s.categories).length > 0) {
                        detailedStats = `<div class="grid grid-cols-4 gap-2 mt-2 pt-2 border-t border-slate-800">`;
                        for(let c in s.categories) {
                            if(s.categories[c] > 0) {
                                detailedStats += `<div class="text-center bg-slate-800/50 rounded p-1"><div class="text-[9px] text-slate-400 uppercase">${c}</div><div class="text-xs font-bold text-white">${s.categories[c]}</div></div>`;
                            }
                        }
                        detailedStats += `</div>`;
                    }

                    let controls = "";
                    if(s.is_complete || s.status.includes("Cancelled") || s.status.includes("Failed")) {
                        clearInterval(timer);
                        controls = `<button onclick="dismissTask('${id}')" class="text-[10px] font-bold text-slate-300 bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">DISMISS</button>`;
                        if(s.result_url) controls += `<a href="${s.result_url}" class="ml-2 text-[10px] font-bold text-white bg-green-600 px-3 py-1 rounded">DOWNLOAD</a>`;
                    } else {
                        controls = `<button onclick="cancelTask('${id}')" class="text-[10px] font-bold text-red-400 border border-red-500/30 px-3 py-1 rounded">CANCEL</button>`;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between mb-3">
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black text-slate-500 uppercase tracking-widest">${s.action}</span>
                                <span class="text-[9px] text-blue-400">#${id}</span>
                            </div>
                            <div class="flex items-center gap-2">${controls}</div>
                        </div>
                        <div class="text-xs font-bold text-white mb-2 truncate">${s.status} <span class="text-slate-500 font-normal">- ${s.last_file || ''}</span></div>
                        <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
                            <div class="h-full bg-blue-600 transition-all duration-300" style="width:${s.percent}%"></div>
                        </div>
                        <div class="flex justify-between mt-2 text-[10px] font-bold text-slate-400">
                            <div>Done: <span class="text-white">${s.current}</span> / ${s.total}</div>
                            <div>${s.percent}%</div>
                        </div>
                        ${detailedStats}
                    `;
                } catch(e) {}
            }, 1000);
        }

        window.onload = initAuth;
    </script>
</body>
</html>
