<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX | Drive Pro Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #020617; color: #cbd5e1; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .btn-pro { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-pro:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5); }
        .btn-pro:disabled { opacity: 0.5; cursor: not-allowed; }
        .card-anim { animation: slideIn 0.4s ease-out forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">

    <!-- Nav -->
    <nav class="sticky top-0 z-50 border-b border-slate-800 bg-[#020617]/80 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-blue-600 rounded-xl shadow-lg shadow-blue-500/20">
                    <i class="fab fa-google-drive text-white text-xl"></i>
                </div>
                <h1 class="text-xl font-bold text-white tracking-tight">TechZoneX <span class="text-blue-500">Pro</span></h1>
            </div>
            <div id="auth-status">
                <button onclick="login()" class="btn-pro px-6 py-2.5 rounded-full text-sm font-bold text-white">Connect Account</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-6 space-y-8">
        
        <!-- Smart Progress Monitor -->
        <div id="task-monitor" class="hidden space-y-4">
            <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Active System Tasks</h2>
            <div id="task-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
        </div>

        <!-- Tool Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- Recursive Copy -->
            <div class="glass p-6 rounded-3xl space-y-5">
                <div class="flex items-center gap-3">
                    <i class="fas fa-layer-group text-blue-500 text-lg"></i>
                    <h3 class="text-white font-bold">Recursive Cloner</h3>
                </div>
                <input type="text" id="cp-src" placeholder="Source Folder URL" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3.5 text-sm outline-none focus:border-blue-500 transition-colors">
                <input type="text" id="cp-dst" placeholder="Destination URL" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3.5 text-sm outline-none focus:border-blue-500 transition-colors">
                <button onclick="execute('copy', {src:'cp-src', dst:'cp-dst'})" class="w-full btn-pro py-3.5 rounded-2xl font-bold text-white shadow-lg">Start Deep Clone</button>
            </div>

            <!-- Smart Replace -->
            <div class="glass p-6 rounded-3xl space-y-5">
                <div class="flex items-center gap-3">
                    <i class="fas fa-bolt-lightning text-amber-500 text-lg"></i>
                    <h3 class="text-white font-bold">Smart Swap</h3>
                </div>
                <input type="text" id="sr-target" placeholder="Target Folder URL" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3.5 text-sm outline-none">
                <input type="text" id="sr-sample" placeholder="Sample File URL" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3.5 text-sm outline-none">
                <input type="text" id="sr-replace" placeholder="Replacement URL" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3.5 text-sm outline-none">
                <button onclick="execute('smart_replace', {target:'sr-target', sample:'sr-sample', replace:'sr-replace'})" class="w-full btn-pro from-amber-600 to-amber-700 py-3.5 rounded-2xl font-bold text-white shadow-lg" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%)">Execute Smart Swap</button>
            </div>

            <!-- Analysis Tools -->
            <div class="glass p-6 rounded-3xl space-y-5">
                <div class="flex items-center gap-3">
                    <i class="fas fa-magnifying-glass-chart text-emerald-500 text-lg"></i>
                    <h3 class="text-white font-bold">Quick Analysis</h3>
                </div>
                <input type="text" id="qa-url" placeholder="Folder/File URL" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl p-3.5 text-sm outline-none focus:border-emerald-500 transition-colors">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="execute('count', {url:'qa-url'})" class="btn-pro py-3.5 rounded-2xl font-bold text-xs" style="background: #10b981">Count Files</button>
                    <button onclick="execute('info', {url:'qa-url'})" class="btn-pro py-3.5 rounded-2xl font-bold text-xs" style="background: #059669">Get Info</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";

        function login() { window.location.href = API + "/auth/login"; }

        function checkAuth() {
            const hash = window.location.hash;
            if (hash.includes('auth_data=')) {
                localStorage.setItem('drive_creds', decodeURIComponent(hash.split('auth_data=')[1]));
                window.history.replaceState(null, null, window.location.pathname);
            }
            if (localStorage.getItem('drive_creds')) {
                document.getElementById('auth-status').innerHTML = `
                    <div class="bg-slate-900/80 border border-slate-700 px-5 py-2 rounded-full flex items-center gap-3">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-bold text-white uppercase">Cloud System Online</span>
                    </div>`;
            }
        }

        async function execute(action, inputs) {
            const creds = localStorage.getItem('drive_creds');
            if (!creds) return alert("System Not Authorized!");
            
            const body = { action, creds };
            for (let k in inputs) body[k] = document.getElementById(inputs[k]).value;

            try {
                const res = await fetch(API + '/api/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                trackTask(data.task_id);
            } catch (e) { alert("Backend Connection Lost"); }
        }

        function trackTask(id) {
            document.getElementById('task-monitor').classList.remove('hidden');
            const grid = document.getElementById('task-grid');
            const card = document.createElement('div');
            card.className = "glass p-5 rounded-2xl card-anim border-blue-500/20";
            grid.appendChild(card);

            const interval = setInterval(async () => {
                const res = await fetch(`${API}/api/status/${id}`);
                const s = await res.json();

                let report = "";
                if(s.is_complete) {
                    report = `<div class="mt-4 pt-4 border-t border-slate-800 grid grid-cols-2 gap-2">`;
                    for(let cat in s.categories) {
                        report += `<div class="text-[10px] bg-slate-800/50 p-2 rounded-lg flex justify-between">
                            <span class="text-slate-400">${cat}</span>
                            <span class="text-white font-bold">${s.categories[cat]}</span>
                        </div>`;
                    }
                    report += `</div>`;
                    clearInterval(interval);
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full ${s.is_complete ? 'bg-green-500' : 'bg-blue-500 animate-pulse'}"></div>
                            <span class="text-[10px] font-bold text-white uppercase">${s.action}</span>
                        </div>
                        <span class="text-[10px] font-mono text-slate-500">#${id}</span>
                    </div>
                    <div class="text-xs font-bold text-white mb-2 truncate">${s.last_file || 'Preparing...'}</div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden">
                        <div class="bg-blue-600 h-full transition-all duration-700" style="width: ${s.percent}%"></div>
                    </div>
                    <div class="flex justify-between mt-3 text-[10px] font-bold">
                        <div class="text-slate-400">
                            PROCESSED: <span class="text-white">${s.current}</span> / 
                            REMAINING: <span class="text-blue-400">${s.remaining}</span>
                        </div>
                        <div class="text-blue-500">${s.percent}%</div>
                    </div>
                    ${report}
                    ${s.is_complete ? `<button onclick="this.parentElement.remove()" class="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-[10px] font-bold uppercase transition-colors">Dismiss Report</button>` : ''}
                `;
            }, 1500);
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
