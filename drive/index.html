<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #030712; color: #e2e8f0; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(55, 65, 81, 0.5); border-radius: 1.5rem; }
        .btn-glow { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        input, select { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; }
        .hidden-menu { display: none; }
        .show-menu { display: block; animation: slideDown 0.2s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4">

    <div class="max-w-6xl mx-auto space-y-6">
        
        <nav class="bg-slate-900/90 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4 border border-slate-800 sticky top-2 z-50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center"><i class="fab fa-google-drive text-white"></i></div>
                <div>
                    <h1 class="font-bold text-white leading-tight">TECHZONEX</h1>
                    <div class="flex items-center gap-2">
                        <div id="status-dot" class="w-2 h-2 bg-red-500 rounded-full"></div>
                        <span id="status-text" class="text-[10px] uppercase text-slate-400">Offline</span>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleMenu()" class="px-4 py-2 bg-slate-800 rounded-lg text-sm font-bold text-white border border-slate-700">
                    <i class="fas fa-bars mr-1"></i> Menu
                </button>
                <div id="auth-btn"></div>
            </div>

            <div id="quick-menu" class="hidden-menu w-full basis-full mt-4 bg-slate-950 rounded-xl p-2 border border-slate-800">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                    <button onclick="scrollToCard('copy')" class="p-2 text-xs text-slate-300 hover:bg-slate-800 rounded text-left"><i class="fas fa-copy text-blue-500 mr-2"></i>Clone</button>
                    <button onclick="scrollToCard('rename')" class="p-2 text-xs text-slate-300 hover:bg-slate-800 rounded text-left"><i class="fas fa-i-cursor text-purple-500 mr-2"></i>Rename</button>
                    <button onclick="scrollToCard('trim')" class="p-2 text-xs text-slate-300 hover:bg-slate-800 rounded text-left"><i class="fas fa-scissors text-red-500 mr-2"></i>Trim</button>
                    <button onclick="scrollToCard('watermark')" class="p-2 text-xs text-slate-300 hover:bg-slate-800 rounded text-left"><i class="fas fa-stamp text-cyan-500 mr-2"></i>Watermark</button>
                </div>
            </div>
        </nav>

        <div id="monitor-panel" class="hidden">
            <div class="flex justify-between items-center mb-2 px-2">
                <h2 class="text-xs font-bold text-slate-500 uppercase">Active Tasks</h2>
                <button onclick="clearAll()" class="text-[10px] text-blue-400 hover:underline">Clear All</button>
            </div>
            <div id="task-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div id="card-watermark" class="glass-panel p-6 space-y-4">
                <div class="flex justify-between"><i class="fas fa-stamp text-cyan-500 text-xl"></i> <span class="text-[10px] bg-slate-900 px-2 rounded text-slate-500">OPT-10</span></div>
                <h3 class="font-bold text-white">Video Watermark</h3>
                <input type="text" id="wm-url" placeholder="Video ID/Link" class="w-full p-3 rounded-xl text-sm">
                <select id="wm-type" class="w-full p-3 rounded-xl text-sm bg-slate-900 text-white border border-slate-700">
                    <option value="text">Scrolling Text</option>
                    <option value="image">Logo Overlay</option>
                </select>
                <input type="text" id="wm-text" placeholder="Text (Use | for lines)" class="w-full p-3 rounded-xl text-sm">
                <button onclick="run('watermark', {url:'wm-url', type:'wm-type', text:'wm-text'})" class="w-full py-3 btn-glow rounded-xl font-bold text-sm text-white">Apply</button>
            </div>

            <div id="card-trim" class="glass-panel p-6 space-y-4">
                <div class="flex justify-between"><i class="fas fa-scissors text-red-500 text-xl"></i> <span class="text-[10px] bg-slate-900 px-2 rounded text-slate-500">OPT-08</span></div>
                <h3 class="font-bold text-white">Video Trimmer</h3>
                <input type="text" id="tr-url" placeholder="Video ID/Link" class="w-full p-3 rounded-xl text-sm" onblur="fetchDuration(this.value)">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="tr-start" placeholder="Start" class="p-3 rounded-xl text-sm">
                    <input type="text" id="tr-end" placeholder="End" class="p-3 rounded-xl text-sm">
                </div>
                <button onclick="run('trim', {url:'tr-url', start:'tr-start', end:'tr-end'})" class="w-full py-3 bg-red-600 hover:bg-red-700 rounded-xl font-bold text-sm text-white">Trim</button>
            </div>

            <div id="card-copy" class="glass-panel p-6 space-y-4">
                <div class="flex justify-between"><i class="fas fa-copy text-blue-500 text-xl"></i> <span class="text-[10px] bg-slate-900 px-2 rounded text-slate-500">OPT-01</span></div>
                <h3 class="font-bold text-white">Clone Folder</h3>
                <input type="text" id="cp-src" placeholder="Source ID" class="w-full p-3 rounded-xl text-sm">
                <input type="text" id="cp-dst" placeholder="Destination ID" class="w-full p-3 rounded-xl text-sm">
                <button onclick="run('copy', {src:'cp-src', dst:'cp-dst'})" class="w-full py-3 bg-blue-600 rounded-xl font-bold text-sm text-white">Clone</button>
            </div>

        </div>
    </div>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app"; // CHANGE THIS
        const tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

        function toggleMenu() { document.getElementById('quick-menu').classList.toggle('hidden-menu'); document.getElementById('quick-menu').classList.toggle('show-menu'); }
        function scrollToCard(id) { document.getElementById('card-'+id).scrollIntoView({behavior:'smooth'}); toggleMenu(); }

        async function init() {
            try { await fetch(API+'/'); document.getElementById('status-dot').className="w-2 h-2 bg-green-500 rounded-full"; document.getElementById('status-text').innerText="Online"; }
            catch { document.getElementById('status-dot').className="w-2 h-2 bg-red-500 rounded-full"; }
            
            const creds = localStorage.getItem('creds');
            if(window.location.hash.includes('auth_data=')) {
                localStorage.setItem('creds', JSON.parse(decodeURIComponent(window.location.hash.split('auth_data=')[1])));
                window.history.replaceState(null,null,' '); location.reload();
            }
            
            const btn = document.getElementById('auth-btn');
            if(creds) btn.innerHTML = `<button onclick="localStorage.removeItem('creds');location.reload()" class="px-4 py-2 bg-red-500/20 text-red-200 rounded-lg text-xs font-bold border border-red-500/50">Logout</button>`;
            else btn.innerHTML = `<button onclick="location.href='${API}/auth/login'" class="px-4 py-2 bg-green-600 text-white rounded-lg text-xs font-bold">Login</button>`;
            
            tasks.forEach(track);
        }

        async function fetchDuration(url) {
            if(!url || !localStorage.getItem('creds')) return;
            document.getElementById('tr-start').value = "Loading...";
            try {
                const r = await fetch(API+'/api/get_duration', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url, creds:localStorage.getItem('creds')})});
                const d = await r.json();
                if(d.duration) { document.getElementById('tr-start').value="00:00:00"; document.getElementById('tr-end').value=d.duration; }
            } catch(e) {}
        }

        async function run(action, fields) {
            if(!localStorage.getItem('creds')) return alert("Login first");
            const body = {action, creds: localStorage.getItem('creds')};
            for(let k in fields) body[k] = document.getElementById(fields[k]).value;
            
            try {
                const r = await fetch(API+'/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
                const d = await r.json();
                tasks.push(d.task_id); localStorage.setItem('tasks', JSON.stringify(tasks));
                track(d.task_id);
            } catch { alert("Failed to start"); }
        }

        function track(id) {
            document.getElementById('monitor-panel').classList.remove('hidden');
            if(document.getElementById('c-'+id)) return;
            const card = document.createElement('div');
            card.id = 'c-'+id;
            card.className = "bg-slate-900/80 border border-slate-700 p-4 rounded-xl";
            document.getElementById('task-list').appendChild(card);

            const t = setInterval(async () => {
                try {
                    const r = await fetch(API+'/api/status/'+id);
                    const s = await r.json();
                    
                    let stats = "";
                    if(s.categories) {
                        stats = `<div class="grid grid-cols-3 gap-1 mt-2 border-t border-slate-800 pt-2">` + 
                        Object.keys(s.categories).map(k => s.categories[k]>0?`<div class="text-[9px] text-slate-400">${k}: <b class="text-white">${s.categories[k]}</b></div>`:"").join('') + `</div>`;
                    }

                    let btn = `<button onclick="fetch('${API}/api/cancel/${id}',{method:'POST'})" class="text-red-400 text-[10px] font-bold">CANCEL</button>`;
                    if(s.is_complete) {
                        clearInterval(t);
                        btn = `<button onclick="dismiss('${id}')" class="text-slate-400 text-[10px] font-bold">DISMISS</button>`;
                        if(s.result_url) btn += `<a href="${s.result_url}" class="ml-2 text-green-400 text-[10px] font-bold">DOWNLOAD</a>`;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between mb-2">
                            <span class="text-[10px] font-bold text-blue-400 uppercase">${s.action}</span>
                            <div>${btn}</div>
                        </div>
                        <div class="text-xs font-bold text-white mb-1 truncate">${s.status}</div>
                        <div class="w-full bg-slate-950 h-1 rounded overflow-hidden"><div class="bg-blue-500 h-full" style="width:${s.percent}%"></div></div>
                        ${stats}
                    `;
                } catch {}
            }, 1000);
        }

        function dismiss(id) {
            document.getElementById('c-'+id).remove();
            const idx = tasks.indexOf(id); if(idx>-1) tasks.splice(idx,1);
            localStorage.setItem('tasks', JSON.stringify(tasks));
            fetch(API+'/api/dismiss/'+id, {method:'POST'});
            if(tasks.length===0) document.getElementById('monitor-panel').classList.add('hidden');
        }

        function clearAll() {
            tasks.forEach(id => fetch(API+'/api/dismiss/'+id, {method:'POST'}));
            tasks.length=0; localStorage.setItem('tasks', '[]');
            document.getElementById('task-list').innerHTML="";
            document.getElementById('monitor-panel').classList.add('hidden');
        }

        window.onload = init;
    </script>
</body>
</html>
