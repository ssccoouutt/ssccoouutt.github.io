<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX | Ultimate Drive Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #030712; color: #e2e8f0; }
        .glass-panel { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(20px); border: 1px solid rgba(55, 65, 81, 0.5); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); transition: all 0.3s ease; }
        .glass-panel:hover { border-color: rgba(59, 130, 246, 0.5); transform: translateY(-2px); }
        .btn-glow { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); transition: all 0.3s; }
        .btn-glow:hover { box-shadow: 0 0 20px rgba(37, 99, 235, 0.5); transform: scale(1.02); }
        .btn-cancel { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-cancel:hover { background: rgba(239, 68, 68, 0.4); }
        input { background: #0f172a !important; border: 1px solid #1e293b !important; color: white !important; font-size: 0.8rem !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-900/80 p-6 rounded-[2rem] border border-slate-800">
            <div class="flex items-center gap-4 mb-4 md:mb-0">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fab fa-google-drive text-white text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">TECHZONEX</h1>
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-medium text-slate-400 uppercase tracking-widest">System Online</span>
                    </div>
                </div>
            </div>
            <div id="auth-container">
                <button onclick="login()" class="px-8 py-3 btn-glow text-white rounded-xl font-bold text-sm">Initialize Connection</button>
            </div>
        </header>

        <!-- Live Monitor -->
        <div id="monitor-panel" class="hidden space-y-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fas fa-microchip text-blue-500 animate-spin-slow"></i>
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest">Active Processes</h2>
                </div>
                <button onclick="clearCompleted()" class="text-[10px] text-slate-500 hover:text-white underline">Clear All Completed</button>
            </div>
            <div id="task-list" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
        </div>

        <!-- Tools Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <!-- 1. Copy -->
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-blue-500/10 rounded-xl"><i class="fas fa-copy text-blue-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-01</span>
                </div>
                <h3 class="text-lg font-bold text-white">Recursive Clone</h3>
                <input type="text" id="cp-src" placeholder="Source Folder ID/URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <input type="text" id="cp-dst" placeholder="Destination (Empty for Root)" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('copy', {src:'cp-src', dst:'cp-dst'})" class="w-full py-3 btn-glow rounded-xl font-bold text-sm text-white">Start Cloning</button>
            </div>

            <!-- 2. Rename -->
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-purple-500/10 rounded-xl"><i class="fas fa-i-cursor text-purple-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-02</span>
                </div>
                <h3 class="text-lg font-bold text-white">Bulk Renamer</h3>
                <input type="text" id="rn-url" placeholder="Folder URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="rn-s" placeholder="Find" class="p-3 rounded-xl text-sm input-dark">
                    <input type="text" id="rn-r" placeholder="Replace" class="p-3 rounded-xl text-sm input-dark">
                </div>
                <button onclick="run('rename', {url:'rn-url', search:'rn-s', replace:'rn-r'})" class="w-full py-3 bg-purple-600 hover:bg-purple-700 transition rounded-xl font-bold text-sm text-white">Execute Rename</button>
            </div>

            <!-- 3 & 5. Analysis -->
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-pink-500/10 rounded-xl"><i class="fas fa-chart-pie text-pink-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-03/05</span>
                </div>
                <h3 class="text-lg font-bold text-white">Quick Diagnostics</h3>
                <input type="text" id="qa-url" placeholder="File or Folder URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="run('count', {url:'qa-url'})" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-xs uppercase transition text-slate-300">Count Files</button>
                    <button onclick="run('info', {url:'qa-url'})" class="py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold text-xs uppercase transition text-slate-300">Get Metadata</button>
                </div>
            </div>

            <!-- 4. Automation -->
            <div class="glass-panel p-6 rounded-3xl space-y-4 border-dashed border-slate-700">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-yellow-500/10 rounded-xl"><i class="fas fa-bolt text-yellow-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-04</span>
                </div>
                <h3 class="text-lg font-bold text-white">Auto Workflow</h3>
                <p class="text-xs text-slate-500">Clones Source 1 -> Merges Source 2 -> Brands .mp4 files</p>
                <input type="text" id="at-url" placeholder="Primary Source URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('automated', {url:'at-url'})" class="w-full py-3 bg-yellow-600 hover:bg-yellow-700 transition rounded-xl font-bold text-sm text-white">Run Sequence</button>
            </div>

            <!-- 6. Smart Replace -->
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-orange-500/10 rounded-xl"><i class="fas fa-sync-alt text-orange-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-06</span>
                </div>
                <h3 class="text-lg font-bold text-white">Smart Swap</h3>
                <input type="text" id="sr-target" placeholder="Target Folder" class="w-full p-3 rounded-xl text-sm input-dark">
                <input type="text" id="sr-sample" placeholder="Sample File" class="w-full p-3 rounded-xl text-sm input-dark">
                <input type="text" id="sr-replace" placeholder="Replacement File" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('smart_replace', {target:'sr-target', sample:'sr-sample', replace:'sr-replace'})" class="w-full py-3 bg-orange-600 hover:bg-orange-700 transition rounded-xl font-bold text-sm text-white">Swap Matches</button>
            </div>

            <!-- 7. Distribution -->
            <div class="glass-panel p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-start">
                    <div class="p-3 bg-emerald-500/10 rounded-xl"><i class="fas fa-network-wired text-emerald-500"></i></div>
                    <span class="text-[10px] font-bold text-slate-600 bg-slate-900 px-2 py-1 rounded">OPT-07</span>
                </div>
                <h3 class="text-lg font-bold text-white">Smart Distribute</h3>
                <input type="text" id="sd-target" placeholder="Root Target URL" class="w-full p-3 rounded-xl text-sm input-dark">
                <input type="text" id="sd-src" placeholder="File to Distribute" class="w-full p-3 rounded-xl text-sm input-dark">
                <button onclick="run('distribute', {target:'sd-target', source:'sd-src'})" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 transition rounded-xl font-bold text-sm text-white">Start Sync</button>
            </div>

        </div>
    </div>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";
        const tasks = JSON.parse(localStorage.getItem('active_tasks') || '[]');

        function login() { window.location.href = API + "/auth/login"; }

        function initAuth() {
            const h = window.location.hash;
            if (h.includes('auth_data=')) {
                localStorage.setItem('drive_creds', decodeURIComponent(h.split('auth_data=')[1]));
                window.history.replaceState(null, null, window.location.pathname);
            }
            if (localStorage.getItem('drive_creds')) {
                document.getElementById('auth-container').innerHTML = `
                    <div class="flex items-center gap-3 bg-slate-900 border border-slate-700 px-5 py-2.5 rounded-xl">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-widest">Authorized</span>
                        <button onclick="localStorage.removeItem('drive_creds'); location.reload()" class="ml-2 text-slate-500 hover:text-white transition"><i class="fas fa-sign-out-alt"></i></button>
                    </div>`;
            }
            // Restore tasks on reload
            tasks.forEach(id => track(id));
        }

        async function run(action, fields) {
            const creds = localStorage.getItem('drive_creds');
            if (!creds) return alert("Please connect your account first.");
            
            const body = { action, creds };
            for(let k in fields) body[k] = document.getElementById(fields[k]).value;

            try {
                const res = await fetch(API + '/api/run', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
                });
                const data = await res.json();
                
                // Persist task ID
                tasks.push(data.task_id);
                localStorage.setItem('active_tasks', JSON.stringify(tasks));
                
                track(data.task_id);
            } catch(e) { alert("Error connecting to cloud engine."); }
        }

        async function cancelTask(id) {
            if(confirm("Terminate this task?")) {
                await fetch(`${API}/api/cancel/${id}`, {method:'POST'});
            }
        }

        function dismissTask(id, card) {
            card.remove();
            const idx = tasks.indexOf(id);
            if(idx > -1) {
                tasks.splice(idx, 1);
                localStorage.setItem('active_tasks', JSON.stringify(tasks));
            }
            if(tasks.length === 0) document.getElementById('monitor-panel').classList.add('hidden');
        }

        function clearCompleted() {
            document.querySelectorAll('.task-completed').forEach(c => {
                const btn = c.querySelector('button[onclick^="dismissTask"]');
                if(btn) btn.click();
            });
        }

        function track(id) {
            document.getElementById('monitor-panel').classList.remove('hidden');
            
            // Avoid duplicates on reload
            if(document.getElementById(`card-${id}`)) return;

            const grid = document.getElementById('task-list');
            const card = document.createElement('div');
            card.id = `card-${id}`;
            card.className = "bg-slate-900/50 border border-blue-500/20 p-5 rounded-2xl relative overflow-hidden transition-all duration-500";
            grid.appendChild(card);

            const timer = setInterval(async () => {
                try {
                    const r = await fetch(`${API}/api/status/${id}`);
                    const s = await r.json();

                    // If server restarted and task lost, handle gracefully
                    if(s.status === "Waiting" && tasks.includes(id)) {
                        // Keep polling or mark as lost? Let's assume waiting for worker.
                    }

                    let metaInfo = "";
                    if(s.action === "Copying") metaInfo = `<span class="text-blue-400">#${s.meta.src} <i class="fas fa-arrow-right mx-1"></i> ${s.meta.dst}</span>`;
                    if(s.action === "Renaming") metaInfo = `<span class="text-purple-400">"${s.meta.find}" <i class="fas fa-arrow-right mx-1"></i> "${s.meta.with}"</span>`;
                    if(s.action === "Distribution") metaInfo = `<span class="text-emerald-400">Syncing: ${s.meta.file}</span>`;

                    let stats = "";
                    let controls = `<button onclick="cancelTask('${id}')" class="text-[10px] font-bold text-red-400 border border-red-500/30 px-3 py-1 rounded hover:bg-red-500/10">CANCEL</button>`;
                    
                    if(s.is_complete || s.status === "Cancelled") {
                        clearInterval(timer);
                        card.classList.add('task-completed');
                        controls = `<button onclick="dismissTask('${id}', this.closest('.bg-slate-900\\/50'))" class="text-[10px] font-bold text-slate-300 bg-slate-700 px-3 py-1 rounded hover:bg-slate-600">DISMISS REPORT</button>`;
                        
                        stats = `<div class="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-slate-800">`;
                        for(let c in s.categories) stats += `<div class="bg-slate-950 p-2 rounded text-center"><div class="text-[9px] text-slate-500 uppercase">${c}</div><div class="text-xs font-bold text-white">${s.categories[c]}</div></div>`;
                        if(s.meta && s.meta.size) stats += `<div class="col-span-3 text-center text-[10px] text-slate-400 mt-2">File Size: ${s.meta.size} bytes</div>`;
                        stats += `</div>`;
                    }

                    card.innerHTML = `
                        <div class="flex justify-between mb-3">
                            <div class="flex flex-col"><span class="text-[9px] font-black text-slate-500 uppercase tracking-[0.2em]">${s.action}</span><div class="text-[9px] font-mono">${metaInfo}</div></div>
                            <div class="flex items-center gap-3">
                                ${controls}
                                <span class="text-[9px] bg-slate-800 px-2 py-1 rounded text-slate-400">#${id}</span>
                            </div>
                        </div>
                        <div class="text-xs font-bold text-white mb-2 truncate">${s.status} <span class="text-slate-500 font-normal"> - ${s.last_file || ''}</span></div>
                        <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
                            <div class="progress-line ${s.status === 'Cancelled' ? 'bg-red-500' : 'bg-blue-600'} h-full" style="width:${s.percent}%"></div>
                        </div>
                        <div class="flex justify-between mt-3 text-[10px] font-bold">
                            <div class="text-slate-400 uppercase tracking-tighter">DONE:<span class="text-white">${s.current}</span> | SKIP:<span class="text-orange-400">${s.skipped}</span> | LEFT:<span class="text-blue-500">${s.remaining}</span></div>
                            <div class="${s.status === 'Cancelled' ? 'text-red-500' : 'text-blue-500'}">${s.percent}%</div>
                        </div>
                        ${stats}
                    `;
                } catch(e) { 
                    // Handle network error silently
                }
            }, 1800);
        }

        window.onload = initAuth;
    </script>
</body>
</html>
