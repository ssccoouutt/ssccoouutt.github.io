<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX | Drive Cloud Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .btn-blue { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .btn-green { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    </style>
</head>
<body class="bg-[#020617] text-slate-300 min-h-screen">

    <nav class="border-b border-slate-800 bg-[#020617]/90 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fab fa-google-drive text-blue-500 text-2xl"></i>
                <h1 class="text-xl font-black text-white uppercase tracking-widest">TechZoneX</h1>
            </div>
            <div id="auth-ui">
                <button onclick="login()" class="btn-blue text-white px-6 py-2 rounded-full font-bold text-sm transition-transform hover:scale-105">
                    <i class="fas fa-key mr-2"></i> Connect Account
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 space-y-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Replace Tool -->
            <div class="glass p-6 rounded-2xl space-y-4">
                <h3 class="text-lg font-bold text-white flex items-center">
                    <i class="fas fa-sync-alt mr-3 text-blue-400"></i> Smart Replace
                </h3>
                <input type="text" id="sr-target" placeholder="Target Folder URL" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none">
                <input type="text" id="sr-sample" placeholder="Sample File (To Match)" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none">
                <input type="text" id="sr-replace" placeholder="Replacement File" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none">
                <button onclick="run('smart_replace', {target_url: 'sr-target', sample_url: 'sr-sample', replace_url: 'sr-replace'})" class="w-full btn-blue py-3 rounded-xl font-bold">Start Replacement</button>
            </div>

            <!-- Distribute Tool -->
            <div class="glass p-6 rounded-2xl space-y-4">
                <h3 class="text-lg font-bold text-white flex items-center">
                    <i class="fas fa-sitemap mr-3 text-green-400"></i> Smart Distribute
                </h3>
                <input type="text" id="sd-target" placeholder="Root Folder URL" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-green-500 outline-none">
                <input type="text" id="sd-src" placeholder="Source File URL" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-green-500 outline-none">
                <button onclick="run('smart_distribute', {target_url: 'sd-target', source_url: 'sd-src'})" class="w-full btn-green py-3 rounded-xl font-bold">Fill Subfolders</button>
            </div>

            <!-- Copy Tool -->
            <div class="glass p-6 rounded-2xl space-y-4">
                <h3 class="text-lg font-bold text-white flex items-center">
                    <i class="fas fa-clone mr-3 text-purple-400"></i> Recursive Copy
                </h3>
                <input type="text" id="cp-src" placeholder="Source Folder URL" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-purple-500 outline-none">
                <input type="text" id="cp-dst" placeholder="Destination Folder URL" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-purple-500 outline-none">
                <button onclick="run('copy_folder', {source_url: 'cp-src', dest_url: 'cp-dst'})" class="w-full bg-purple-600 py-3 rounded-xl font-bold hover:bg-purple-700 transition">Execute Clone</button>
            </div>

        </div>

        <div id="status-box" class="fixed bottom-6 right-6 p-4 rounded-xl bg-slate-800 border border-blue-500 hidden max-w-sm">
            <div class="flex items-center space-x-3">
                <div class="animate-spin h-4 w-4 border-2 border-blue-500 border-t-transparent rounded-full"></div>
                <span id="status-text" class="text-sm">Processing task...</span>
            </div>
        </div>
    </main>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";

        function login() { window.location.href = API + "/auth/login"; }

        function init() {
            const hash = window.location.hash;
            if (hash.includes('auth_data=')) {
                localStorage.setItem('drive_creds', decodeURIComponent(hash.split('auth_data=')[1]));
                window.history.replaceState(null, null, window.location.pathname);
            }
            if (localStorage.getItem('drive_creds')) {
                document.getElementById('auth-ui').innerHTML = `
                    <div class="bg-green-500/10 border border-green-500/20 px-4 py-2 rounded-full flex items-center">
                        <span class="h-2 w-2 bg-green-500 rounded-full mr-2"></span>
                        <span class="text-xs font-bold text-green-500">Cloud Active</span>
                        <button onclick="localStorage.removeItem('drive_creds'); location.reload()" class="ml-4 text-[10px] underline text-slate-500">Exit</button>
                    </div>`;
            }
        }

        async function run(endpoint, fields) {
            const creds = localStorage.getItem('drive_creds');
            if (!creds) return alert("Authorize First!");

            const body = { creds: creds };
            for (let key in fields) body[key] = document.getElementById(fields[key]).value;

            const box = document.getElementById('status-box');
            box.classList.remove('hidden');

            try {
                const res = await fetch(`${API}/api/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                document.getElementById('status-text').innerText = data.status;
                setTimeout(() => box.classList.add('hidden'), 5000);
            } catch (e) {
                alert("Connection Error");
                box.classList.add('hidden');
            }
        }
        window.onload = init;
    </script>
</body>
</html>
