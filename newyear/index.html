<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX | Happy New Year 2026</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .content {
            z-index: 2;
        }
        h1 {
            font-size: 4rem;
            background: linear-gradient(to right, #f39c12, #f1c40f, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }
        p {
            font-size: 1.5rem;
            color: #aaa;
        }
        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #ffffff1a 1px, transparent 1px);
            background-size: 50px 50px;
            animation: move 10s linear infinite;
        }
        @keyframes move {
            from { transform: translateY(0); }
            to { transform: translateY(-1000px); }
        }
    </style>
</head>
<body>
    <div class="sparkles"></div>
    <div class="content">
        <h1>Happy New Year 2026</h1>
        <p>TechZoneX wishes you a year of innovation and success.</p>
        <a href="/" style="color: #f39c12; text-decoration: none;">← Back to Home</a>
    </div>
</body>
</html>
