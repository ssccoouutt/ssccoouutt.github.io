<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Pro - TechZoneX</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white p-5">
    <div class="max-w-3xl mx-auto space-y-6">
        <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
            <h1 class="text-2xl font-bold mb-4">YouTube Downloader</h1>
            <div class="flex gap-2">
                <input type="text" id="yt-url" placeholder="Paste YouTube Link" class="flex-1 bg-black border border-gray-700 p-3 rounded-lg">
                <button onclick="analyzeVideo()" class="bg-blue-600 px-6 py-3 rounded-lg font-bold">Analyze</button>
            </div>
        </div>

        <div id="video-card" class="hidden bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
            <div class="flex gap-4">
                <img id="v-thumb" class="w-40 rounded-lg shadow-lg">
                <h2 id="v-title" class="font-bold text-lg"></h2>
            </div>
            <div id="quality-list" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
            <input type="text" id="folder-id" placeholder="Google Drive Folder ID (Optional)" class="w-full bg-black border border-gray-700 p-3 rounded-lg">
            <button id="dl-btn" onclick="startDownload()" class="w-full bg-green-600 py-4 rounded-lg font-bold text-lg">Start Upload to Drive</button>
        </div>

        <div id="progress-card" class="hidden bg-gray-900 p-6 rounded-xl border border-gray-800 text-center">
            <p id="p-status" class="mb-2 font-bold text-blue-400"></p>
            <div class="w-full bg-gray-800 h-3 rounded-full overflow-hidden">
                <div id="p-bar" class="bg-blue-500 h-full w-0 transition-all"></div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";
        let selQ = null;

        async function analyzeVideo() {
            const url = document.getElementById('yt-url').value;
            const creds = localStorage.getItem('creds');
            if(!creds) return alert("Login on the main page first!");

            const res = await fetch(`${API}/api/youtube/info`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url, creds })
            });
            const data = await res.json();

            if(data.success) {
                document.getElementById('video-card').classList.remove('hidden');
                document.getElementById('v-title').innerText = data.title;
                document.getElementById('v-thumb').src = data.thumbnail;
                
                const container = document.getElementById('quality-list');
                container.innerHTML = "";
                data.qualities.forEach(q => {
                    const btn = document.createElement('button');
                    btn.className = "p-2 bg-gray-800 rounded border border-gray-700 hover:bg-gray-700 text-sm";
                    btn.innerText = q.label;
                    btn.onclick = () => {
                        selQ = q.quality;
                        Array.from(container.children).forEach(b => b.classList.remove('border-blue-500', 'bg-blue-900/30'));
                        btn.classList.add('border-blue-500', 'bg-blue-900/30');
                    };
                    container.appendChild(btn);
                });
            } else { alert("Error: " + data.error); }
        }

        async function startDownload() {
            if(!selQ) return alert("Select quality first!");
            const res = await fetch(`${API}/api/run`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: 'youtube',
                    url: document.getElementById('yt-url').value,
                    quality: selQ,
                    destination: document.getElementById('folder-id').value,
                    creds: localStorage.getItem('creds')
                })
            });
            const data = await res.json();
            trackTask(data.id);
        }

        function trackTask(id) {
            document.getElementById('progress-card').classList.remove('hidden');
            const itv = setInterval(async () => {
                const res = await fetch(`${API}/api/status/${id}`);
                const s = await res.json();
                document.getElementById('p-status').innerText = s.status;
                document.getElementById('p-bar').style.width = (s.percent || 0) + "%";
                if(s.is_complete) {
                    clearInterval(itv);
                    if(s.drive_link) window.open(s.drive_link, '_blank');
                }
            }, 2000);
        }
    </script>
</body>
</html>
