<!DOCTYPE html>
<html>
<head>
    <title>YouTube Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #e2e8f0; }
        .glass-panel { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(55, 65, 81, 0.5); border-radius: 1rem; }
        input, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
        .progress-bar { background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-2xl mx-auto">
        <div class="glass-panel p-6 mb-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center">
                    <i class="fab fa-youtube text-white text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">YouTube Downloader</h1>
                    <p class="text-sm text-slate-400">Download videos directly to your Google Drive</p>
                </div>
            </div>
            
            <div id="auth-status" class="mb-4"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">YouTube URL</label>
                    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." class="w-full p-3 rounded-lg">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Quality</label>
                        <select id="quality" class="w-full p-3 rounded-lg">
                            <option value="best">🎯 Best Available</option>
                            <option value="1080">📺 1080p</option>
                            <option value="720">🖥️ 720p</option>
                            <option value="480">📱 480p</option>
                            <option value="360">📲 360p</option>
                        </select>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Processing</label>
                        <select id="process-type" class="w-full p-3 rounded-lg">
                            <option value="none">⬇️ Download Only</option>
                            <option value="trim">✂️ Trim Video</option>
                            <option value="watermark">💧 Add Watermark</option>
                        </select>
                    </div>
                </div>
                
                <div id="trim-options" class="hidden space-y-3 p-4 bg-slate-900/50 rounded-lg">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">Start Time (HH:MM:SS)</label>
                            <input type="text" id="start-time" placeholder="00:00:00" class="w-full p-2 rounded text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1">End Time (HH:MM:SS)</label>
                            <input type="text" id="end-time" placeholder="00:01:00" class="w-full p-2 rounded text-sm">
                        </div>
                    </div>
                </div>
                
                <div id="watermark-options" class="hidden space-y-3 p-4 bg-slate-900/50 rounded-lg">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Watermark Type</label>
                        <select id="wm-type" class="w-full p-2 rounded text-sm">
                            <option value="text">📝 Text Watermark</option>
                            <option value="image">🖼️ Logo Image</option>
                        </select>
                    </div>
                    <div id="wm-text-option" class="hidden">
                        <input type="text" id="wm-text" placeholder="Enter watermark text" class="w-full p-2 rounded text-sm">
                    </div>
                    <div id="wm-image-option" class="hidden">
                        <input type="text" id="wm-logo" placeholder="Google Drive Logo ID" class="w-full p-2 rounded text-sm">
                        <p class="text-xs text-slate-500 mt-1">Upload logo to Google Drive and paste its ID</p>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Destination Folder ID (Optional)</label>
                    <input type="text" id="destination" placeholder="Google Drive Folder ID" class="w-full p-3 rounded-lg">
                    <p class="text-xs text-slate-500 mt-1">Leave empty to upload to your Drive root</p>
                </div>
                
                <button onclick="downloadYouTube()" class="w-full py-3 bg-red-600 hover:bg-red-700 rounded-lg font-bold text-white transition duration-200">
                    🚀 Download & Process
                </button>
            </div>
        </div>
        
        <div id="progress" class="glass-panel p-6 mb-6 hidden">
            <h2 class="text-lg font-bold text-white mb-3">Download Progress</h2>
            <div class="w-full bg-slate-800 h-4 rounded-full overflow-hidden mb-2">
                <div id="progress-bar" class="progress-bar h-full rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-sm">
                <span id="progress-text" class="text-slate-300">0%</span>
                <span id="status" class="text-slate-400">Initializing...</span>
            </div>
        </div>
        
        <div id="result" class="glass-panel p-6"></div>
    </div>
    
    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";
        
        // Check authentication
        document.addEventListener('DOMContentLoaded', function() {
            const creds = localStorage.getItem('creds');
            const authStatus = document.getElementById('auth-status');
            
            if (!creds) {
                authStatus.innerHTML = `
                    <div class="p-3 bg-red-900/30 border border-red-500/30 rounded-lg">
                        <p class="text-red-200 text-sm">⚠️ Please login first!</p>
                        <button onclick="goToLogin()" class="mt-2 px-4 py-2 bg-red-600 text-white rounded text-xs font-bold">
                            Go to Login
                        </button>
                    </div>`;
            } else {
                authStatus.innerHTML = `
                    <div class="p-3 bg-green-900/30 border border-green-500/30 rounded-lg">
                        <p class="text-green-200 text-sm">✅ Logged in successfully</p>
                    </div>`;
            }
            
            // Toggle options based on process type
            document.getElementById('process-type').addEventListener('change', function() {
                const trimOptions = document.getElementById('trim-options');
                const wmOptions = document.getElementById('watermark-options');
                
                trimOptions.classList.add('hidden');
                wmOptions.classList.add('hidden');
                
                if (this.value === 'trim') {
                    trimOptions.classList.remove('hidden');
                } else if (this.value === 'watermark') {
                    wmOptions.classList.remove('hidden');
                    toggleWatermarkOptions();
                }
            });
            
            // Toggle watermark options
            document.getElementById('wm-type').addEventListener('change', toggleWatermarkOptions);
        });
        
        function toggleWatermarkOptions() {
            const wmType = document.getElementById('wm-type').value;
            document.getElementById('wm-text-option').classList.toggle('hidden', wmType !== 'text');
            document.getElementById('wm-image-option').classList.toggle('hidden', wmType !== 'image');
        }
        
        function goToLogin() {
            window.open(API + '/auth/login', '_blank');
        }
        
        async function downloadYouTube() {
            const creds = localStorage.getItem('creds');
            if (!creds) {
                alert('Please login first!');
                goToLogin();
                return;
            }
            
            const url = document.getElementById('url').value.trim();
            if (!url.includes('youtube.com') && !url.includes('youtu.be')) {
                alert('Please enter a valid YouTube URL');
                return;
            }
            
            const quality = document.getElementById('quality').value;
            const processType = document.getElementById('process-type').value;
            const destination = document.getElementById('destination').value.trim();
            
            const processData = {};
            if (processType === 'trim') {
                processData.start = document.getElementById('start-time').value || '00:00:00';
                processData.end = document.getElementById('end-time').value || '00:01:00';
            } else if (processType === 'watermark') {
                const wmType = document.getElementById('wm-type').value;
                processData.type = wmType;
                if (wmType === 'text') {
                    processData.text = document.getElementById('wm-text').value || 'Watermark';
                } else {
                    processData.logo_id = document.getElementById('wm-logo').value;
                    if (!processData.logo_id) {
                        alert('Please enter a Google Drive Logo ID for image watermark');
                        return;
                    }
                }
            }
            
            // Show progress
            document.getElementById('progress').classList.remove('hidden');
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-text').textContent = '0%';
            document.getElementById('status').textContent = 'Starting download...';
            document.getElementById('result').innerHTML = '';
            
            try {
                const response = await fetch(API + '/api/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        action: 'youtube',
                        creds: creds,
                        url: url,
                        quality: quality,
                        process_type: processType,
                        process_data: processData,
                        destination: destination || null
                    })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                
                if (data.id) {
                    pollProgress(data.id);
                } else {
                    throw new Error('No task ID received');
                }
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <div class="p-4 bg-red-900/30 border border-red-500/30 rounded-lg">
                        <p class="text-red-200">❌ Error: ${error.message}</p>
                    </div>`;
                document.getElementById('progress').classList.add('hidden');
            }
        }
        
        async function pollProgress(taskId) {
            const interval = setInterval(async () => {
                try {
                    const response = await fetch(API + '/api/status/' + taskId);
                    const status = await response.json();
                    
                    if (status.percent !== undefined) {
                        document.getElementById('progress-bar').style.width = status.percent + '%';
                        document.getElementById('progress-text').textContent = status.percent + '%';
                        document.getElementById('status').textContent = status.status;
                    }
                    
                    if (status.is_complete) {
                        clearInterval(interval);
                        
                        if (status.status.includes('Failed')) {
                            document.getElementById('result').innerHTML = `
                                <div class="p-4 bg-red-900/30 border border-red-500/30 rounded-lg">
                                    <p class="text-red-200">❌ ${status.status}</p>
                                </div>`;
                        } else {
                            let resultHtml = `
                                <div class="p-4 bg-green-900/30 border border-green-500/30 rounded-lg">
                                    <p class="text-green-200 text-lg font-bold mb-2">✅ Download Complete!</p>`;
                            
                            if (status.result_url) {
                                resultHtml += `
                                    <div class="flex gap-2 mt-3">
                                        <a href="${status.result_url}" target="_blank" 
                                           class="px-4 py-2 bg-green-600 text-white rounded text-sm font-bold hover:bg-green-700">
                                           📥 Download File
                                        </a>`;
                                
                                if (status.drive_link) {
                                    resultHtml += `
                                        <a href="${status.drive_link}" target="_blank" 
                                           class="px-4 py-2 bg-blue-600 text-white rounded text-sm font-bold hover:bg-blue-700">
                                           📁 Open in Drive
                                        </a>`;
                                }
                                
                                resultHtml += `</div>`;
                            }
                            
                            resultHtml += `</div>`;
                            document.getElementById('result').innerHTML = resultHtml;
                        }
                        
                        // Hide progress after 5 seconds
                        setTimeout(() => {
                            document.getElementById('progress').classList.add('hidden');
                        }, 5000);
                    }
                } catch (error) {
                    clearInterval(interval);
                    document.getElementById('result').innerHTML = `
                        <div class="p-4 bg-red-900/30 border border-red-500/30 rounded-lg">
                            <p class="text-red-200">❌ Error checking progress: ${error.message}</p>
                        </div>`;
                    document.getElementById('progress').classList.add('hidden');
                }
            }, 1000);
        }
    </script>
</body>
</html>
