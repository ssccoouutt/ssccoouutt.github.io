<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Downloader - TechZoneX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-950 text-slate-200 p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <div class="bg-gray-900 p-6 rounded-xl border border-gray-800">
            <h1 class="text-xl font-bold mb-4">YouTube to Drive</h1>
            <div class="flex gap-2">
                <input type="text" id="yt-url" placeholder="Paste YouTube Link" class="flex-1 bg-gray-950 border border-gray-700 p-3 rounded-lg">
                <button onclick="analyze()" class="bg-blue-600 px-6 py-3 rounded-lg font-bold">Analyze</button>
            </div>
        </div>

        <div id="info-card" class="hidden bg-gray-900 p-6 rounded-xl border border-gray-800 space-y-4">
            <div class="flex gap-4">
                <img id="thumb" class="w-32 rounded-lg">
                <div>
                    <h2 id="title" class="font-bold text-lg"></h2>
                    <p id="meta" class="text-sm text-gray-500"></p>
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-bold mb-2">Select Quality</label>
                <div id="qualities" class="grid grid-cols-2 md:grid-cols-3 gap-2"></div>
            </div>

            <input type="text" id="dest-id" placeholder="Google Drive Folder ID (Optional)" class="w-full bg-gray-950 border border-gray-700 p-3 rounded-lg">
            <button onclick="startDownload()" class="w-full bg-green-600 py-4 rounded-lg font-bold">Start Download</button>
        </div>

        <div id="status-card" class="hidden bg-gray-900 p-6 rounded-xl border border-gray-800">
            <div id="status-text" class="text-sm font-bold mb-2">Initializing...</div>
            <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                <div id="status-bar" class="bg-blue-500 h-full w-0 transition-all"></div>
            </div>
        </div>
    </div>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";
        let selectedQuality = null;

        async function analyze() {
            const url = document.getElementById('yt-url').value;
            const creds = localStorage.getItem('creds');
            if(!creds) return alert("Login on main page first");

            const res = await fetch(`${API}/api/youtube/info`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url, creds })
            });
            const data = await res.json();

            if(data.success) {
                document.getElementById('info-card').classList.remove('hidden');
                document.getElementById('title').innerText = data.title;
                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('meta').innerText = `${data.uploader} • ${Math.floor(data.duration/60)}m`;
                
                const qContainer = document.getElementById('qualities');
                qContainer.innerHTML = "";
                // FIX: Use data.qualities instead of data.formats
                data.qualities.forEach(q => {
                    const btn = document.createElement('button');
                    btn.className = "p-2 bg-gray-800 rounded border border-gray-700 text-xs hover:bg-gray-700";
                    btn.innerText = q.label;
                    btn.onclick = () => {
                        selectedQuality = q.quality;
                        Array.from(qContainer.children).forEach(c => c.classList.remove('border-blue-500'));
                        btn.classList.add('border-blue-500');
                    };
                    qContainer.appendChild(btn);
                });
            }
        }

        async function startDownload() {
            if(!selectedQuality) return alert("Select a quality");
            const body = {
                action: 'youtube',
                url: document.getElementById('yt-url').value,
                quality: selectedQuality,
                destination: document.getElementById('dest-id').value,
                creds: localStorage.getItem('creds')
            };

            const res = await fetch(`${API}/api/run`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });
            const data = await res.json();
            track(data.id);
        }

        function track(tid) {
            document.getElementById('status-card').classList.remove('hidden');
            const interval = setInterval(async () => {
                const res = await fetch(`${API}/api/status/${tid}`);
                const s = await res.json();
                document.getElementById('status-text').innerText = s.status;
                document.getElementById('status-bar').style.width = `${s.percent}%`;
                if(s.is_complete) {
                    clearInterval(interval);
                    if(s.drive_link) window.open(s.drive_link, '_blank');
                }
            }, 2000);
        }
    </script>
</body>
</html>
