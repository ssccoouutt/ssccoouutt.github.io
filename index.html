<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX Pro Downloader</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: white; text-align: center; padding: 20px; }
        .container { background: #1e1e1e; padding: 30px; border-radius: 15px; max-width: 500px; margin: auto; }
        input { width: 80%; padding: 12px; border-radius: 5px; border: none; margin-bottom: 10px; }
        select { width: 85%; padding: 10px; margin: 10px 0; border-radius: 5px; display: none; }
        button { background: #ff0000; color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #dlBtn { background: #28a745; display: none; margin-top: 10px; }
        .loading { color: #f1c40f; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TechZoneX Pro</h1>
        <input type="text" id="videoUrl" placeholder="Paste YouTube Link">
        <button onclick="fetchQualities()">Check Qualities</button>
        
        <p class="loading" id="status">Fetching data...</p>

        <select id="formatSelector"></select>
        <button id="dlBtn" onclick="forceDownload()">Download Selected Quality</button>
        
        <div id="result"></div>
    </div>

    <script>
        const API_URL = "https://heapy-melynda-achingly.ngrok-free.dev/"; 
        let currentUrl = "";

        async function fetchQualities() {
            currentUrl = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');
            const selector = document.getElementById('formatSelector');
            
            status.style.display = "block";
            const response = await fetch(`${API_URL}/get_formats`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url: currentUrl })
            });
            const data = await response.json();
            status.style.display = "none";

            if(data.formats) {
                selector.innerHTML = data.formats.map(f => 
                    `<option value="${f.format_id}">${f.resolution} (${f.ext})</option>`).join('');
                selector.style.display = "block";
                document.getElementById('dlBtn').style.display = "inline-block";
            }
        }

        async function forceDownload() {
            const fId = document.getElementById('formatSelector').value;
            const res = await fetch(`${API_URL}/download`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ url: currentUrl, format_id: fId })
            });
            const data = await res.json();
            
            // This is the trick to FORCE download
            const a = document.createElement('a');
            a.href = data.url;
            a.setAttribute('download', 'video.mp4'); 
            a.click();
        }
    </script>
</body>
</html>
