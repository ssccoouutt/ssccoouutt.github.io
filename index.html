<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX | Pro Downloader</title>
    <style>
        :root { --accent: #ff0000; --bg: #0d1117; --card: #161b22; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; text-align: center; padding: 20px; }
        .container { background: var(--card); padding: 30px; border-radius: 12px; max-width: 600px; margin: auto; border: 1px solid #30363d; }
        .input-box { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background: #010409; color: white; }
        button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        video { width: 100%; border-radius: 8px; margin-top: 20px; display: none; background: #000; }
        select { width: 100%; padding: 10px; margin-top: 20px; border-radius: 6px; display: none; background: #30363d; color: white; }
        #dlBtn { background: #238636; width: 100%; margin-top: 15px; display: none; }
        #status { margin: 15px 0; color: #8b949e; }
    </style>
</head>
<body>
    <div class="container">
        <h1>TechZoneX <span style="color:var(--accent)">PRO</span></h1>
        <div class="input-box">
            <input type="text" id="videoUrl" placeholder="Paste YouTube link here...">
            <button onclick="analyzeVideo()">Analyze</button>
        </div>
        <p id="status">Ready.</p>

        <video id="player" controls></video>
        
        <select id="formatSelector"></select>
        <button id="dlBtn" onclick="startDownload()">Download Merged High-Quality</button>
    </div>

    <script>
        // UPDATE THIS URL FROM COLAB EVERY TIME YOU RESTART
        const API_URL = "https://heapy-melynda-achingly.ngrok-free.dev"; 

        async function analyzeVideo() {
            const url = document.getElementById('videoUrl').value;
            const status = document.getElementById('status');
            if(!url) return alert("Please enter a URL");

            status.innerText = "Connecting to Colab and fetching qualities...";
            
            try {
                const response = await fetch(`${API_URL}/get_formats`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                
                const data = await response.json();
                if(data.error) throw new Error(data.error);

                // Show Video Player
                const player = document.getElementById('player');
                player.src = data.best_stream;
                player.style.display = "block";
                
                // Fill Select Box
                const selector = document.getElementById('formatSelector');
                selector.innerHTML = data.formats
                    .sort((a,b) => b.resolution - a.resolution)
                    .map(f => `<option value="${f.format_id}">${f.resolution}p - ${f.note} (.${f.ext})</option>`)
                    .join('');
                selector.style.display = "block";
                document.getElementById('dlBtn').style.display = "block";
                status.innerText = "Video Ready: " + data.title;

            } catch (err) {
                status.innerText = "Error: " + err.message;
                console.error(err);
            }
        }

        async function startDownload() {
            const btn = document.getElementById('dlBtn');
            const url = document.getElementById('videoUrl').value;
            const fId = document.getElementById('formatSelector').value;
            
            btn.innerText = "Merging Audio + Video... Please wait";
            btn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format_id: fId })
                });
                const data = await response.json();
                
                // Force Download
                const a = document.createElement('a');
                a.href = data.url;
                a.setAttribute('download', 'video.mp4');
                a.click();
            } catch (err) {
                alert("Download failed. Check if Colab is still running.");
            } finally {
                btn.innerText = "Download Merged High-Quality";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
