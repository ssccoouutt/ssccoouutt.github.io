<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZoneX Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #030712; color: #e2e8f0; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 1rem; }
        input, select { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; font-size: 0.85rem !important; }
        ::-webkit-scrollbar { width: 5px; background: #0f172a; } ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 5px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-7xl mx-auto space-y-6">
        <nav class="glass p-4 flex justify-between items-center sticky top-2 z-50">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center text-xl font-bold">TZ</div>
                <div><h1 class="font-bold leading-none">TECHZONEX</h1><span class="text-[10px] text-green-400 font-mono">SYSTEM ONLINE</span></div>
            </div>
            <div id="auth-btn"></div>
        </nav>

        <div id="monitor" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div class="glass p-5 space-y-3 border-t-2 border-cyan-500">
                <div class="flex justify-between"><h3 class="font-bold">💧 Watermark</h3><span class="text-[10px] bg-cyan-900/30 text-cyan-400 px-2 rounded">BULK READY</span></div>
                <input type="text" id="wm-url" placeholder="Video OR Folder Link" class="w-full p-3 rounded-lg">
                <select id="wm-type" class="w-full p-3 rounded-lg bg-slate-900" onchange="toggleWm()">
                    <option value="text">Scrolling Text</option>
                    <option value="image">Logo Overlay</option>
                </select>
                <div id="wm-txt"><input type="text" id="wm-text" placeholder="Text Content" class="w-full p-3 rounded-lg"></div>
                <div id="wm-img" class="hidden"><input type="text" id="wm-logo" placeholder="Logo File Link" class="w-full p-3 rounded-lg"></div>
                <button onclick="run('watermark', {url:'wm-url', type:'wm-type', text:'wm-text', logo_id:'wm-logo'})" class="w-full py-3 bg-cyan-600 hover:bg-cyan-500 rounded-lg font-bold">START PROCESSING</button>
            </div>

            <div class="glass p-5 space-y-3 border-t-2 border-indigo-500">
                <div class="flex justify-between"><h3 class="font-bold">🔗 Merger</h3><span class="text-[10px] bg-indigo-900/30 text-indigo-400 px-2 rounded">BULK READY</span></div>
                <p class="text-xs text-slate-400">If Folder used in Video 2, Video 1 is applied as Intro to all.</p>
                <input type="text" id="mg-1" placeholder="Video 1 (Intro) Link" class="w-full p-3 rounded-lg">
                <input type="text" id="mg-2" placeholder="Video 2 (Main/Folder) Link" class="w-full p-3 rounded-lg">
                <button onclick="run('merge', {src1:'mg-1', src2:'mg-2'})" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-lg font-bold">START MERGE</button>
            </div>

            <div class="glass p-5 space-y-3 border-t-2 border-red-500">
                <div class="flex justify-between"><h3 class="font-bold">✂️ Trimmer</h3><span class="text-[10px] bg-red-900/30 text-red-400 px-2 rounded">BULK READY</span></div>
                <input type="text" id="tr-url" placeholder="Video OR Folder Link" class="w-full p-3 rounded-lg" onblur="getDur(this.value)">
                <div class="flex gap-2">
                    <input type="text" id="tr-s" placeholder="00:00:00" class="w-full p-3 rounded-lg">
                    <input type="text" id="tr-e" placeholder="00:00:10" class="w-full p-3 rounded-lg">
                </div>
                <button onclick="run('trim', {url:'tr-url', start:'tr-s', end:'tr-e'})" class="w-full py-3 bg-red-600 hover:bg-red-500 rounded-lg font-bold">START TRIM</button>
            </div>

            <div class="glass p-5 space-y-3 border-t-2 border-blue-500">
                <h3 class="font-bold">📂 Copy Folder</h3>
                <input type="text" id="cp-s" placeholder="Source Link" class="w-full p-3 rounded-lg">
                <input type="text" id="cp-d" placeholder="Destination Link" class="w-full p-3 rounded-lg">
                <button onclick="run('copy', {src:'cp-s', dst:'cp-d'})" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-lg font-bold">COPY</button>
            </div>

        </div>
    </div>

    <script>
        const API = "https://simple-liana-techzone3201-048a28fa.koyeb.app";
        const tasks = JSON.parse(localStorage.getItem('t') || '[]');

        function toggleWm() {
            const t = document.getElementById('wm-type').value;
            document.getElementById('wm-txt').style.display = t==='text'?'block':'none';
            document.getElementById('wm-img').style.display = t==='image'?'block':'none';
        }

        async function getDur(url) {
            if(!url) return;
            try {
                const r = await fetch(API+'/api/get_duration', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({url, creds: localStorage.getItem('c')})
                });
                const d = await r.json();
                if(d.duration) document.getElementById('tr-e').value = d.duration;
            } catch(e) {}
        }

        function init() {
            if(window.location.hash.includes('auth_data=')) {
                localStorage.setItem('c', JSON.parse(decodeURIComponent(window.location.hash.split('auth_data=')[1])));
                window.history.replaceState(null,null,' ');
            }
            const c = localStorage.getItem('c');
            document.getElementById('auth-btn').innerHTML = c ? 
                `<button onclick="localStorage.removeItem('c');location.reload()" class="text-red-400 font-bold text-sm">LOGOUT</button>` : 
                `<a href="${API}/auth/login" class="bg-green-600 px-4 py-2 rounded-lg font-bold text-sm">LOGIN GOOGLE</a>`;
            tasks.forEach(track);
        }

        async function run(act, flds) {
            if(!localStorage.getItem('c')) return alert("Login First");
            const b = {action: act, creds: localStorage.getItem('c')};
            for(let k in flds) b[k] = document.getElementById(flds[k]).value;
            
            try {
                const r = await fetch(API+'/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(b)});
                const d = await r.json();
                tasks.push(d.id); localStorage.setItem('t', JSON.stringify(tasks));
                track(d.id);
            } catch(e) { alert("Failed: "+e); }
        }

        function track(id) {
            document.getElementById('monitor').classList.remove('hidden');
            if(document.getElementById('c-'+id)) return;
            const el = document.createElement('div');
            el.id = 'c-'+id; el.className = "glass p-4";
            document.getElementById('monitor').appendChild(el);

            const intv = setInterval(async()=>{
                try {
                    const r = await fetch(API+'/api/status/'+id);
                    const s = await r.json();
                    
                    let resHtml = "";
                    if(s.is_complete) {
                        clearInterval(intv);
                        if(s.result_url && !s.status.includes("Failed")) {
                            resHtml = `
                            <div class="mt-3 border-t border-slate-700 pt-3">
                                <video controls class="w-full rounded mb-2 border border-slate-700"><source src="${s.result_url}" type="video/mp4"></video>
                                <div class="flex gap-2">
                                    <a href="${s.result_url}" class="flex-1 bg-green-600 text-center py-2 rounded text-sm font-bold">Download</a>
                                    ${s.drive_link ? `<a href="${s.drive_link}" target="_blank" class="flex-1 bg-blue-600 text-center py-2 rounded text-sm font-bold">Open Drive</a>` : ''}
                                </div>
                            </div>`;
                        }
                    }

                    el.innerHTML = `
                        <div class="flex justify-between mb-2">
                            <span class="font-bold text-blue-400 text-sm tracking-widest">${s.action || 'TASK'}</span>
                            <button onclick="dismiss('${id}')" class="text-xs text-slate-500">❌</button>
                        </div>
                        <div class="text-sm font-bold text-white truncate">${s.status}</div>
                        <div class="w-full bg-slate-900 h-1.5 rounded-full mt-2 overflow-hidden">
                            <div class="bg-blue-500 h-full transition-all duration-300" style="width:${s.percent}%"></div>
                        </div>
                        ${resHtml}
                    `;
                } catch(e) { clearInterval(intv); }
            }, 1500);
        }

        function dismiss(id) {
            document.getElementById('c-'+id).remove();
            const idx = tasks.indexOf(id); if(idx>-1) tasks.splice(idx,1);
            localStorage.setItem('t', JSON.stringify(tasks));
            fetch(API+'/api/dismiss/'+id, {method:'POST'});
        }

        window.onload = init;
    </script>
</body>
</html>
